name: Build Hotspot Racing APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract game project
        run: |
          mkdir game
          unzip -o Hotspot_Racing_2_0_4Player.zip -d game

      - name: Build APK
        working-directory: game
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hotspot-Racing-APK
          path: game/app/build/outputs/apk/debug/*.apk
